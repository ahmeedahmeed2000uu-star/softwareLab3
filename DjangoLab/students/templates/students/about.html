<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>من نحن | حول النظام</title>
    <!-- خط Cairo الجميل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #1e2229;
            --card-bg: #2b303c;
            --accent-yellow: #ffca28;
            --yellow-glow: rgba(255, 202, 40, 0.25);
            --text-light: #f8f9fa;
            --text-muted: #a0aec0;
            --border-gray: #3f4756;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        /* خلفية بأشكال هندسية ناعمة */
        .shape-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--yellow-glow) 0%, transparent 70%);
            top: -50px;
            right: -50px;
            z-index: 1;
        }

        .shape-square {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255, 202, 40, 0.1);
            transform: rotate(45deg);
            bottom: -60px;
            left: -60px;
            z-index: 1;
        }

        /* الكارت الرئيسي */
        .about-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-gray);
            border-radius: 20px;
            width: 100%;
            max-width: 650px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 2;
            text-align: center;
        }

        /* الأيقونة العلوية */
        .icon-box {
            width: 80px;
            height: 80px;
            background-color: var(--accent-yellow);
            color: var(--bg-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 8px 20px var(--yellow-glow);
        }

        .about-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .about-title span {
            color: var(--accent-yellow);
        }

        .divider {
            width: 60px;
            height: 4px;
            background-color: var(--accent-yellow);
            margin: 1rem auto 1.5rem auto;
            border-radius: 2px;
        }

        .about-desc {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        /* شبكة الميزات الصغرى */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .feature-item {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            padding: 1rem;
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            border-color: var(--accent-yellow);
            transform: translateY(-3px);
        }

        .feature-item h4 {
            color: var(--accent-yellow);
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }

        .feature-item p {
color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* زر العودة */
        .btn-back {
            display: inline-block;
            background-color: var(--accent-yellow);
            color: var(--bg-dark);
            font-weight: 700;
            padding: 0.75rem 2rem;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--yellow-glow);
        }

        .btn-back:hover {
            background-color: #ffd54f;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <!-- أشكال خلفية دائرية ومربعة -->
    <div class="shape-circle"></div>
    <div class="shape-square"></div>

    <!-- البطاقة الرئيسية -->
    <div class="about-card">
        <div class="icon-box">🎓</div>
        <h1 class="about-title">حول <span>النظام</span></h1>
        <div class="divider"></div>
        
        <p class="about-desc">
            هذا النظام مصمم بخصائص متقدمة لمساعدة الطلاب على متابعة مسيرتهم الأكاديمية وإدارة بياناتهم بسهولة وسلاسة عالية.
        </p>

        <!-- ميزات النظام -->
        <div class="features-grid">
            <div class="feature-item">
                <h4>متابعة الأداء</h4>
                <p>تقارير أكاديمية دقيقة</p>
            </div>
            <div class="feature-item">
                <h4>سهولة الاستخدام</h4>
                <p>واجهة مريحة ومباشرة</p>
            </div>
            <div class="feature-item">
                <h4>أمان وحماية</h4>
                <p>بيانات محفوظة بإحكام</p>
            </div>
        </div>

        <a href="{% url 'students:home' %}" class="btn-back">العودة للرئيسية</a>
    </div>

</body>
</html>
